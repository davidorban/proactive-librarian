name: Publish to PyPI

# Token-less publishing via PyPI Trusted Publisher (OIDC).
# Fires when you push a version tag like v0.1.0. Requires a one-time
# pending-publisher registration on PyPI (see docs/PYPI-PUBLISH.md, Path B).

on:
  push:
    tags: ['v*.*.*']

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install + test (gate the publish on green tests)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
